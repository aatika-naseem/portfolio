[build]
  publish = "client"
  functions = "netlify/functions"

# Keep the same /api/... addresses the frontend already uses
[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200

[[redirects]]
  from = "/api/projects"
  to = "/.netlify/functions/projects"
  status = 200